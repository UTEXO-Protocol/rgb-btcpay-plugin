name: Release

# Manually triggered release pipeline.
#
# How to run:
#   1. Bump <Version> in BTCPayServer.Plugins.RgbUtexo.csproj and "version"
#      in btcpay.plugin.json on the branch you want to release from.
#   2. Push that branch.
#   3. GitHub -> Actions -> "Release" -> Run workflow.
#      - "Use workflow from" picks the branch / commit to tag.
#      - "version" must match the version inside the manifest files.
#
# The workflow will:
#   - Validate that the input version matches both manifest files.
#   - Restore dependencies in locked mode (packages.lock.json must match).
#   - Build the plugin and pack it into a `.btcpay` artifact.
#   - Create (or reuse) the tag v<version> on the chosen commit.
#   - Publish a GitHub Release with the artifact and its sha256.
#   - Generate a SLSA Level 3 build provenance attestation
#     (in-toto JSON, keyless-signed via Sigstore, recorded in Rekor)
#     and attach it to the same Release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to release (e.g., 1.0.6 — without the leading v)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        default: false
        type: boolean
      allow_artifact_replace:
        description: "Confirm replacing an existing release's artifact with different bytes (a rerun that changes the .btcpay output). Leave false to have a rerun fail loudly on a mismatch instead."
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
      tag: ${{ steps.subjects.outputs.tag }}
    env:
      ARTIFACT_NAME: BTCPayServer.Plugins.RgbUtexo.btcpay
      PROJECT_FILE: BTCPayServer.Plugins.RgbUtexo.csproj
      MANIFEST_FILE: btcpay.plugin.json
      TAG: v${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate version matches manifest files
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version }}"

          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$INPUT_VERSION' does not look like SemVer (e.g. 1.0.6 or 1.0.6-rc1)"
            exit 1
          fi

          MANIFEST_VERSION=$(jq -r .version "$MANIFEST_FILE")
          CSPROJ_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' "$PROJECT_FILE")

          echo "input    : $INPUT_VERSION"
          echo "manifest : $MANIFEST_VERSION"
          echo "csproj   : $CSPROJ_VERSION"

          if [[ "$INPUT_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "::error::Input version ($INPUT_VERSION) != $MANIFEST_FILE version ($MANIFEST_VERSION). Bump the manifest first."
            exit 1
          fi
          if [[ "$INPUT_VERSION" != "$CSPROJ_VERSION" ]]; then
            echo "::error::Input version ($INPUT_VERSION) != $PROJECT_FILE <Version> ($CSPROJ_VERSION). Bump the csproj first."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      # Records the commit being judged before anything can be tagged, so a HEAD that moves during the
      # run is caught at the tag step rather than silently tagging something else. The gate native
      # itself is no longer a blob in this commit: it arrives from the published RgbVerifyCffi package
      # through the locked restore below, and the artifact checks after it run under
      # --provenance strict, which binds the shipped entry to the package-cache copy.
      - name: Record the release commit
        run: |
          set -euo pipefail
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # ci.yml triggers only on pull_request, push to main and manual dispatch, none of which a tag
      # publication implies, while this workflow is dispatchable on any ref, so without this step a
      # release could tag a commit whose crate sources were never checked against the recorded
      # manifest. It says nothing about the package's binary -- that is what strict provenance below
      # is for -- only that the recorded inputs still match the tree.
      - name: Require the tagged commit's gate-native source manifest to match its recorded sources
        run: bash scripts/verify-tracked-gate-native-freshness.sh

      - name: Restore (locked mode — packages.lock.json must match)
        run: |
          set -euo pipefail
          dotnet restore "$PROJECT_FILE" \
            --locked-mode \
            -p:ContinuousIntegrationBuild=true

      # Strict provenance below binds the shipped entry to the package-cache copy, but says nothing about
      # which bytes that copy holds. This is the step that does: the tagged commit must record the sha256
      # of every native the pinned package delivers, so a tag cannot ship native bytes nobody reviewed.
      - name: Require the tagged commit to record the hashes of the natives it will ship
        run: bash scripts/verify-gate-native-package-hashes.sh

      - name: Publish (Release)
        run: |
          set -euo pipefail
          dotnet publish "$PROJECT_FILE" \
            -c Release \
            --no-restore \
            -p:ContinuousIntegrationBuild=true \
            -p:Deterministic=true \
            -o publish-out

      - name: Verify complete publish artifact under strict provenance
        run: |
          python3 scripts/verify_plugin_artifact.py publish-out \
            --provenance strict \
            --package-cache "$HOME/.nuget/packages"

      - name: Pack .btcpay
        run: |
          set -euo pipefail
          (cd publish-out && zip -r "../$ARTIFACT_NAME" .)
          sha256sum "$ARTIFACT_NAME" | tee "$ARTIFACT_NAME.sha256"
          ls -lh "$ARTIFACT_NAME" "$ARTIFACT_NAME.sha256"

      - name: Verify final .btcpay archive under strict provenance
        run: |
          python3 scripts/verify_plugin_artifact.py "$ARTIFACT_NAME" \
            --provenance strict \
            --package-cache "$HOME/.nuget/packages"

      # Loads the gate native extracted from the archive that actually ships, inside Debian 12, and
      # resolves all five exports. Content checks cannot see staleness, but they do see a wrong
      # architecture, a truncated file, and a glibc floor above the deployment target.
      - name: Assert the packed gate native loads on Debian 12
        run: bash scripts/verify-artifact-native-loads.sh "$ARTIFACT_NAME"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or verify tag ${{ env.TAG }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_COMMIT:-}" ]]; then
            echo "::error::RELEASE_COMMIT is unset, so the step that records the commit under verification either never ran or never recorded it. An absent value must not read as agreement. Refusing to tag."
            exit 1
          fi
          SHA=$(git rev-parse HEAD)
          if [[ "$SHA" != "$RELEASE_COMMIT" ]]; then
            echo "::error::HEAD is now $SHA but the artifact was verified on $RELEASE_COMMIT. The commit that passed is not the commit this tag would carry."
            exit 1
          fi
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            EXISTING=$(git rev-list -n 1 "refs/tags/$TAG")
            if [[ "$EXISTING" != "$SHA" ]]; then
              echo "::error::Tag $TAG already exists at $EXISTING but workflow runs on $SHA. Refusing to move it."
              echo "::error::Either run the workflow from the correct ref, or delete the tag first."
              exit 1
            fi
            echo "Tag $TAG already exists at $SHA, reusing."
          else
            git tag -a "$TAG" -m "RGB Utexo plugin $TAG" "$SHA"
            git push origin "$TAG"
          fi

      # A rerun of this workflow on the same commit can still reach here (the build is not
      # guaranteed bit-reproducible), and the step below used to delete-and-replace the Release
      # unconditionally. That let a rerun silently swap the downloadable .btcpay bytes under a tag
      # someone already verified and pinned. This proves sameness against the already-published
      # sha256 instead of assuming it, and requires an explicit opt-in to replace on a mismatch.
      - name: Create / replace GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
          ALLOW_ARTIFACT_REPLACE: ${{ inputs.allow_artifact_replace }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release download "$TAG" -p "$ARTIFACT_NAME.sha256" -O previous-release.sha256; then
              PUBLISHED_HASH=$(cut -d' ' -f1 previous-release.sha256)
              NEW_HASH=$(cut -d' ' -f1 "$ARTIFACT_NAME.sha256")
              if [[ "$PUBLISHED_HASH" != "$NEW_HASH" ]]; then
                if [[ "$ALLOW_ARTIFACT_REPLACE" != "true" ]]; then
                  echo "::error::Release $TAG already exists with artifact sha256 $PUBLISHED_HASH, but this run built $NEW_HASH. Refusing to replace it silently. Re-run with 'allow_artifact_replace' checked to confirm an intentional replacement."
                  exit 1
                fi
                echo "::warning::Release $TAG artifact is changing: $PUBLISHED_HASH -> $NEW_HASH (allow_artifact_replace=true)."
              fi
            else
              if [[ "$ALLOW_ARTIFACT_REPLACE" != "true" ]]; then
                echo "::error::Release $TAG already exists but its $ARTIFACT_NAME.sha256 could not be downloaded, so this run cannot prove the artifact is unchanged. Refusing to replace it. Re-run with 'allow_artifact_replace' checked to confirm an intentional replacement."
                exit 1
              fi
              echo "::warning::Release $TAG already exists with no downloadable $ARTIFACT_NAME.sha256 to compare against; replacing it because allow_artifact_replace=true."
            fi
            echo "Release $TAG already exists — replacing it so the artifact stays in sync."
            gh release delete "$TAG" --yes --cleanup-tag=false
          fi
          ARGS=(--title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            "$ARTIFACT_NAME" \
            "$ARTIFACT_NAME.sha256" \
            "${ARGS[@]}"

      - name: Export SLSA subjects (base64 of "<sha256>  <name>")
        id: subjects
        run: |
          set -euo pipefail
          # slsa-github-generator expects a base64-encoded multi-line list of
          # "<sha256>  <name>" lines (the standard sha256sum format).
          HASHES=$(sha256sum "$ARTIFACT_NAME" | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Released $TAG"
            echo
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Artifact: \`$ARTIFACT_NAME\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$ARTIFACT_NAME.sha256")\`"
            echo "- URL: https://github.com/${{ github.repository }}/releases/tag/$TAG"
            echo
            echo "SLSA provenance attestation is attached by the \`provenance\` job below."
          } >> "$GITHUB_STEP_SUMMARY"

  # SLSA Level 3 generic provenance generator.
  # Runs in an isolated reusable workflow (separate runner, scoped OIDC token),
  # signs the attestation keyless via Sigstore, records it in the public Rekor
  # transparency log, and attaches `*.intoto.jsonl` to the Release created above.
  #
  # Verify with:
  #   slsa-verifier verify-artifact BTCPayServer.Plugins.RgbUtexo.btcpay \
  #     --provenance-path BTCPayServer.Plugins.RgbUtexo.btcpay.intoto.jsonl \
  #     --source-uri github.com/UTEXO-Protocol/rgb-btcpay-plugin \
  #     --source-tag vX.Y.Z
  provenance:
    needs: release
    permissions:
      actions: read       # read workflow metadata for the attestation
      id-token: write     # mint the OIDC token Sigstore uses to sign
      contents: write     # attach the *.intoto.jsonl to the Release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: "${{ needs.release.outputs.tag }}"
